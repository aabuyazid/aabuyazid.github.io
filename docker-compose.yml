services:
  jekyll:
    image: amirpourmand/al-folio:v0.10.1
    container_name: al-folio-website
    command: bash -c "
      rm -f Gemfile.lock && 
      rm -rf _site &&
      bundle update &&
      bundler exec jekyll serve --watch --port=8080 --host=0.0.0.0 --livereload --verbose --trace"
    ports:
      - 8080:8080
    volumes:
      - .:/srv/jekyll